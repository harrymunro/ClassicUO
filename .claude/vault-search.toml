# Vault folders that vault-search may read for this repo and its worktrees (the tool finds this
# file by walking up from the working directory). The vault holds other projects' and clients'
# notes: nothing outside Business/UO x Jev/. --folder can narrow inside these folders but never
# widen past them.
folders = ["Business/UO x Jev"]

# Whether excerpts of these notes go to Jev (TypeSafe's model, through OpenRouter's
# zero-retention route) for ranking. On by Harry's decision of 2026-10-08: these are his own
# project notes, with no client data. false means local keyword ranking only. Harry's decision,
# not an agent's.
typesafe = true
