# The lich scene with the leader down first (cuo-e1p): party-lich.toml's five, but Roland is staged where the
# wave spawns, 26 tiles ahead of the others, so he meets the lich and its bone knights alone and dies while the
# others are still walking up. What is measured is what the others do then: before cuo-e1p they waited through
# his resurrection and his walk back; now they carry on the hunt he last set, in spells of three minutes.
# Measure with: uv run python scripts/party_scene.py logs/fleet/RUN, and each follower's session summary
# (carried_on_without_leader) and goals.
# The graveyard's own spawns are cleared for the run (the leader's prep: [AgentDisrupt despawn, 36 tiles round
# its centre for 15 minutes), so what is fought is the wave: on 2026-10-10, after an evening without hunts, the
# graveyard had filled with wraiths, spectres and zombies, and a party that walked in met them and the wave at
# once and was wiped in two and a half minutes whatever it did. Runs before that date had whatever stood there.
name = "party-leader-down"
server_port = 2593
hours = 0.15
headless = true
talk = false
party = true
leader = "Roland"

