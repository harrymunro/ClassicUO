# The lich scene from the update video (cuo-vpb), for party play (cuo-4ar): five classes staged just
# south of the Britain graveyard, a lich with two bone knights and four skeletons waiting 30 tiles north
# (the first member's prep clears the last run's spawns; the last member's spawns the wave, once all are in:
# spawned at the start, a run's leader was killed during the others' logins, its agent still off). One plan: Roland leads, the others follow.
# Measure a run with: uv run python scripts/party_scene.py logs/fleet/RUN
# The graveyard's own spawns are cleared for the run (the leader's prep: [AgentDisrupt despawn, 36 tiles round
# its centre for 15 minutes), so what is fought is the wave: on 2026-10-10, after an evening without hunts, the
# graveyard had filled with wraiths, spectres and zombies, and a party that walked in met them and the wave at
# once and was wiped in two and a half minutes whatever it did. Runs before that date had whatever stood there.
name = "party-lich"
server_port = 2593
# No standing strategy: each character starts the run with none (the leader's planner may still set its own).
# Until 2026-10-12 the file said nothing, and the five ran on whatever their clients' profiles held: a video
# shoot's "never flee: the party stands together" for all of them, with old planner lines after it for some
# ("flee if health drops below 50%"), so who could leave a fight depended on which client folder was used.
strategy = ""
hours = 0.15
headless = true
talk = false
party = true
form_up = false   # its results were taken before a party formed up by default (cuo-cym.12): --set form_up=true to
#                   form up, as the formed-up runs in docs/results.md were
leader = "Roland"

[[agent]]
name = "Roland"
account = "life1"
password = "life1"
port = 5661
profile = "default"
goal = "Hunt the undead at the Britain graveyard with your party: Roland the warrior, Isolde the mage, Wystan the archer, Thea the tamer and Corwin the bard. Stay together."
prep = ["[AgentDisrupt restore quiet", "[AgentReset", "[AgentGo 1392 1528", "[AgentDisrupt despawn 1384 1492 36 15 quiet", "[AgentKit warrior", "[AgentSupplies bandages 150"]

