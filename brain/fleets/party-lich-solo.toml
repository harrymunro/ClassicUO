# The lich scene from the update video (cuo-vpb), for party play (cuo-4ar): five classes staged just
# south of the Britain graveyard, a lich with two bone knights and four skeletons waiting 30 tiles north
# (the first member's prep clears the last run's spawns; the last member's spawns the wave, once all are in:
# spawned at the start, a run's leader was killed during the others' logins, its agent still off). Each plans alone, as in the video's takes 1 and 2: the comparison for party-lich.toml.
# Measure a run with: uv run python scripts/party_scene.py logs/fleet/RUN
# The graveyard's own spawns are cleared for the run (the leader's prep: [AgentDisrupt despawn, 36 tiles round
# its centre for 15 minutes), so what is fought is the wave: on 2026-10-10, after an evening without hunts, the
# graveyard had filled with wraiths, spectres and zombies, and a party that walked in met them and the wave at
# once and was wiped in two and a half minutes whatever it did. Runs before that date had whatever stood there.
name = "party-lich-solo"
server_port = 2593
hours = 0.15
headless = true
talk = false

