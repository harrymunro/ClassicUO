# A second scene for the party (cuo-cym.11): the lich scene's five, staged where they are for it, against
# creatures that stand off and come from two sides. Every party measure before it was one wave from one side
# that closes to fight hand to hand (party-lich.toml: a lich, two bone knights, four skeletons, 30 tiles north),
# and going in together was designed against that: a rally point at the edge, a line held against what comes.
# Here three skeletal mages and two skeletons stand where that wave stood, north-west of the party, and two
# ratman archers and a bone magus 18 tiles east of them: six of the eight cast or shoot from range, and whichever
# group the party turns to, the other is at its side. (At 26 tiles, the first placing, nobody saw the eastern group
# in two runs: the party fights the first group about 23 tiles from it, beyond the 18 tiles a client sees.)
# Measure a run with:
#   uv run python scripts/party_scene.py --wave "skeletal mage,bone magi,ratman archer,skeleton" --boss "" logs/fleet/RUN
# As in the lich scene the first member's prep clears the last run's spawns and stops the graveyard's own for
# the run, and the last member's spawns the wave once all are in. One plan: Roland leads, the others follow.
