# Raising a fallen companion where it fell (cuo-cym.4): the lich scene's five against a lighter wave (a lich and
# four skeletons, as party-inn's). The party forms up and fights; a few seconds into the fight the archer's death
# is staged (scripts/party_slay.py has him say [AgentSlay, the test server's command that kills whoever says it).
# The others win the fight, and then the warrior (Healing and Anatomy 80: bandages) or the mage (Resurrection)
# brings him back where he lies, instead of his ghost walking to the Britain healer and back alone.
#   uv run uo-brain fleet fleets/party-raise.toml --set memory=false &
#   uv run python scripts/party_slay.py --port 5663
# Staging him ahead of the others, to meet the wave alone, doesn't do it: a follower walks back to its leader
# before the wave is spawned (2026-10-13, logs/fleet/20261013-010056-party-raise: nobody died).
# At the kit's skills a try works about one time in four (a bandage on the dead takes 6.5 s), so the ghost
# waits up to a minute after the fight; if nobody manages it, or nobody who could is alive and near, it goes to
# the healer as before.
# Look at a run with: uv run uo-brain party-report logs/fleet/RUN (deaths: "raised where it fell by ...").
