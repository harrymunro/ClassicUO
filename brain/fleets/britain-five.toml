# Five warriors on the local test server (cuo-m70.4): the player's character on the default profile
# (Jev and Sonnet) and four smart NPCs on the npc profile (Jev and Haiku, capped at $0.15/h), with
# goals that spread them about Britain. Needs the server's accountHandler.maxAccountsPerIP above the
# accounts already made (tools/modernuo/README.md). Run from brain/: uv run uo-brain fleet fleets/britain-five.toml
name = "britain-five"
server_port = 2593
hours = 0.33

[[agent]]
name = "Brutus"
account = "warrior"
password = "warrior"
port = 5577
profile = "default"
goal = "Hunt the undead at the Britain graveyard, starting from the West Britain bank. Keep yourself supplied with bandages. Bank your gold and loot when the bag gets heavy."
# The first agent also restocks the Britain healer and shops, so no run starts against an earlier one's purchases.
prep = ["[AgentReset", "[AgentGo 1471 1609", "[AgentRestock 60", "[AgentGo 1425 1690", "[AgentKit warrior",
        "[AgentSupplies bandages 30 gold 400"]

