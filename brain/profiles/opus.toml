# Opus 5.5 for the planner model's one-off calls: its hard moments (escalate), plans for fights
# (design) and the after-action review. Everything else as profiles/default.toml: Decision 1
# for system one with Jev for routine and strategy, Haiku for the routine planner, Sonnet for guide import.
# uo-brain run --profile opus
# Here to try it, not as a recommendation. Measured offline against Sonnet and Haiku on 2026-10-10
# (cuo-vpi, README Results), it wasn't better for its price:
# - escalate: on 78 recorded hard moments it chose as well as Haiku and better than Sonnet by a little
#   (61, 61 and 58 right), at about $0.066 a step against $0.0016 and $0.031, and 8 s against 2 and 3.
# - review: it read the logs more exactly, but ranked a session's main problem last or left it out, and
#   2 of its 13 reviews came back in a shape code doesn't read (review.lines_from), saved as no lines.
# - design: its plans are the first to leave the examples' shape; they haven't been benched.

[models]
system1 = "decision1"   # with Jev for routine and strategy, as in default.toml (cuo-3ni)
routine = "jev"
strategy = "jev"
system2 = "anthropic/claude-haiku-5.5"
escalate = "anthropic/claude-opus-5.5"
design = "anthropic/claude-opus-5.5"
review = "anthropic/claude-opus-5.5"
guide = "anthropic/claude-sonnet-5.5"

# No budget by default. Uncomment for a cap on what the AI calls cost an hour:
# [budget]
# per_hour = 0.60
# over = "slow"   # slow, cheaper or stop (cheaper needs a [cheaper] table, as in sonnet.toml)
